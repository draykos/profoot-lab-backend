# Render Blueprint for profoot-lab-backend.
# Create a new Blueprint Instance at https://dashboard.render.com/select-repo?type=blueprint
# and point it at this repo/branch.
databases:
  - name: profoot-lab-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: profoot-lab-backend
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_CLIENT
        value: postgres
      # Private-network connection string; no DATABASE_SSL needed for it.
      - key: DATABASE_URL
        fromDatabase:
          name: profoot-lab-db
          property: connectionString
      - key: IS_PROXIED
        value: "true"
      # Public URL of the deployed profoot-lab-frontend Render service (or its custom domain).
      # Required for the users-permissions httpOnly refresh-token cookie to work cross-origin.
      - key: CORS_ORIGINS
        sync: false
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
